<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Roleta de Prêmios</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif}body{min-height:100svh;display:flex;flex-direction:column}header{text-align:center;padding:18px 14px 5px}.logo{display:block;max-width:72vw;max-height:76px;object-fit:contain;margin:auto}h1{font-size:clamp(1.25rem,4.6vw,2rem);margin:12px 0 0;line-height:1.15}main{width:100%;max-width:760px;margin:auto;padding:12px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.5vh,22px)}.subtitle{text-align:center;color:#ccc;margin:0;font-size:.95rem}.wheel-wrap{position:relative;width:min(86vw,61svh,540px);aspect-ratio:1;flex-shrink:0}#wheel{width:100%;height:100%;display:block;object-fit:contain;border-radius:50%;box-shadow:0 0 0 3px #252525,0 0 25px #fff1}.pointer{position:absolute;z-index:2;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:clamp(14px,3.5vw,20px) solid transparent;border-right:clamp(14px,3.5vw,20px) solid transparent;border-top:clamp(29px,7vw,42px) solid white;filter:drop-shadow(0 2px 4px #000)}button{width:min(100%,420px);min-height:58px;border:0;border-radius:13px;background:white;color:#000;font:800 1.05rem system-ui,sans-serif;letter-spacing:.04em;padding:14px 20px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}.setup{color:#777;font-size:.78rem;text-underline-offset:3px} [hidden]{display:none!important}@media(min-width:700px) and (min-height:700px){.wheel-wrap{width:min(58vw,53svh,520px)}}@media(max-height:620px) and (orientation:landscape){header{padding:6px}h1{font-size:1.1rem;margin-top:5px}.subtitle{display:none}main{padding:5px 14px;display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,.8fr);gap:12px;max-width:900px}.wheel-wrap{width:min(55vw,68svh,430px);grid-row:span 3}button{width:100%}}
</style>
</head>
<body>
<header>
    <img src="logo.png" alt="Logo do Cliente" class="logo">
    <h1>Roleta de Prêmios</h1>
</header>
<main>
    <p class="subtitle">Toque no botão para girar e descobrir seu prêmio.</p>
    
    <div id="wheelWrap" class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <img id="wheel" src="roleta.png" alt="Roleta de prêmios">
    </div>
    
    <button id="spin">GIRAR A ROLETA</button>
    
    <a class="setup" href="index.html">Configurações (Alinhamento)</a>
</main>

<script>
(()=>{
    const K='roletaPremiosConfigV2',
          wheel=document.getElementById('wheel'),
          spin=document.getElementById('spin');
    
    let cfg=null, rotation=0, busy=false;
    
    try {
        cfg=JSON.parse(localStorage.getItem(K)||'null');
    } catch(e) {}

    spin.addEventListener('click', () => {
        if(busy) return;
        
        const offset = Number(cfg?.offset) || 0;
        
        // Sorteia um tempo de giro entre 3000ms (3s) e 5000ms (5s)
        const durationMs = Math.floor(Math.random() * 2000) + 3000;
        const durationSec = (durationMs / 1000).toFixed(2);
        
        // Descobre a posição atual da roleta (0 a 359 graus)
        const currentAngle = rotation % 360;
        let randomAngle;
        
        // Garante que o novo ângulo fique a pelo menos 20 graus de distância do ângulo atual.
        // Como cada fatia de 10 prêmios tem 36 graus, o ponteiro pode cair na mesma fatia
        // em um ponto ligeiramente diferente, mantendo os 10% de chance para cada prêmio.
        do {
            randomAngle = Math.floor(Math.random() * 360);
        } while (
            Math.abs(randomAngle - currentAngle) < 20 || 
            Math.abs(randomAngle - currentAngle) > 340
        );
        
        // Calcula a diferença para chegar no novo ângulo gerado
        const delta = (randomAngle - currentAngle + 360) % 360;
        
        // 3 a 5 voltas completas
        const extraSpins = (3 + Math.floor(Math.random() * 3)) * 360; 
        
        // Aplica a nova rotação total
        rotation += extraSpins + delta;
        
        busy = true;
        spin.disabled = true;
        spin.textContent = 'GIRANDO…';
        
        // Aplica o tempo sorteado no CSS
        wheel.style.transition = `transform ${durationSec}s cubic-bezier(.12,.72,.12,1)`;
        wheel.style.transform = `rotate(${rotation + offset}deg)`;
        
        let finished = false;
        const finish = () => {
            if(finished) return;
            finished = true;
            wheel.removeEventListener('transitionend', finish);
            busy = false;
            spin.disabled = false;
            spin.textContent = 'GIRAR NOVAMENTE';
        };
        
        // Aguarda o tempo da transição para liberar o botão novamente
        wheel.addEventListener('transitionend', finish);
        
        // Fallback de segurança
        setTimeout(finish, durationMs + 200);
    });
})();
</script>
</body>
</html>
