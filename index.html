<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>Configuração | Roleta</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#171717;font-family:system-ui,Arial,sans-serif}header{background:#111;color:white;padding:22px 16px}header,main{padding-left:max(16px,calc((100% - 800px)/2));padding-right:max(16px,calc((100% - 800px)/2))}h1{font-size:1.5rem;margin:0}header p{color:#ccc;margin:6px 0 0}main{padding-top:18px;padding-bottom:40px}.card{background:white;border:1px solid #ddd;border-radius:15px;padding:18px;margin-bottom:14px}h2{font-size:1.1rem;margin:0 0 12px}label{display:block;font-weight:700;margin:12px 0 7px;font-size:.92rem}input[type=range]{width:100%;padding:11px;background:white}.help{font-size:.84rem;line-height:1.5;color:#666}button,.link{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:750;border:0;border-radius:10px;padding:13px;cursor:pointer}.primary{background:#111;color:white}.secondary{background:#e9e9e9;color:#111}.actions{display:grid;gap:9px;margin-top:14px}#status{font-size:.9rem;color:#28643a;line-height:1.5}@media(min-width:600px){.card{padding:22px}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
    <h1>Configuração da Roleta</h1>
    <p>Ajuste o alinhamento da imagem fixa.</p>
</header>
<main>
    <section class="card">
        <h2>Alinhamento do Ponteiro</h2>
        <label for="offset">Rotação da imagem: <strong id="degrees">0°</strong></label>
        <input id="offset" type="range" min="0" max="359" value="0">
        <p class="help">Use este ajuste para alinhar visualmente as fatias da `roleta.png` com o ponteiro.</p>
        
        <div class="actions">
            <button class="primary" id="save">Salvar alinhamento</button>
            <a class="link secondary" href="roleta.html">Abrir página de sorteio</a>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
    </section>
</main>

<script>
(()=>{
    const K='roletaPremiosConfigV2',
          offset=document.getElementById('offset'),
          degrees=document.getElementById('degrees'),
          status=document.getElementById('status');
    
    try {
        const c=JSON.parse(localStorage.getItem(K)||'null');
        if(c && c.offset !== undefined) {
            offset.value=c.offset;
            degrees.textContent=offset.value+'°';
        }
    } catch(e){}

    offset.addEventListener('input', () => degrees.textContent = offset.value + '°');
    
    document.getElementById('save').addEventListener('click', () => {
        const c = { offset: Number(offset.value) };
        try {
            localStorage.setItem(K, JSON.stringify(c));
            status.textContent = 'Alinhamento salvo! Abra a página de sorteio para testar.';
        } catch(e) {
            status.textContent = 'Erro ao salvar configuração.';
        }
    });
})();
</script>
</body>
</html>
